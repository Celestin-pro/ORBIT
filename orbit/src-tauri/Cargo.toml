[package]
name = "orbit"
version = "0.1.0"
description = "ORBIT – interface console du cloud gaming maison"
edition = "2021"

[lib]
name = "orbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
